<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <title>Страница не найдена — Норма</title>
  <style>
    /* Плоское оформление «Нормы». Страница не подключает внешние файлы: она открывается по любому неверному адресу. */
    :root { --bg: #ffffff; --raised: #f5f6f8; --ink: #141824; --muted: #5b6070; --accent: #1d5fd1; --accent-ink: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(180deg, #d4e3fc 0%, #ffffff 70%) no-repeat, var(--bg); color: var(--ink); font: 16px/1.5 Inter, "Segoe UI", system-ui, sans-serif; text-align: center; }
    main { max-width: 52ch; }
    .brand { display: inline-flex; align-items: baseline; gap: 8px; margin-bottom: 36px; color: inherit; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; }
    .mark { color: var(--accent); font-size: 22px; font-weight: 600; }
    .code { margin: 0 0 8px; color: var(--accent); font-size: 64px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
    p { color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 20px; }
    .button { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 22px; border: 1px solid var(--ink); border-radius: 999px; color: inherit; font-weight: 500; text-decoration: none; }
    .button:hover { background: var(--raised); }
    .button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  </style>
</head>
<body>
  <main>
    <a class="brand home-link" href="/"><span class="mark" aria-hidden="true">§</span>Норма</a>
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Все разделы «Нормы» открываются с главной страницы.</p>
    <div class="actions">
      <a class="button primary home-link" href="/">На главную</a>
      <a class="button home-link" data-hash="app.html#templates" href="/app.html#templates">К шаблонам</a>
    </div>
  </main>
  <script>
    /* На GitHub Pages сайт проекта живёт в папке /имя-репозитория/, а сайт организации в корне.
       Ищем первую папку адреса, в которой лежит приложение, и ведём ссылки туда. */
    (async function () {
      const first = location.pathname.split("/").filter(Boolean)[0];
      let base = "/";
      if (first) {
        try {
          const response = await fetch(`/${first}/manifest.webmanifest`, { method: "HEAD" });
          if (response.ok) base = `/${first}/`;
        } catch (error) { /* остаёмся на корне */ }
      }
      document.querySelectorAll(".home-link").forEach((link) => {
        link.href = base + (link.dataset.hash || "");
      });
    })();
  </script>
</body>
</html>
